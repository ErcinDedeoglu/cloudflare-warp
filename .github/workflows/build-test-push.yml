name: Build, Test & Push

on:
  push:
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'healthcheck/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  IMAGE_NAME: cloudflare-warp
  TEST_TAG: cloudflare-warp-test:latest
  TEST_USER: testuser
  TEST_PASS: testpass123
  DEFAULT_SS_PASS: cloudflare-warp

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image for arm64 (verify only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was built
        run: |
          docker images | grep cloudflare-warp-test
          echo "✅ Images built successfully (amd64 + arm64)"

      - name: Run container
        run: |
          docker run -d \
            --name warp-test \
            -p 1080:1080 \
            -p 1081:1081 \
            -p 8080:8080 \
            -p 8081:8081 \
            ${{ env.TEST_TAG }}
          
          echo "✅ Container started"

      - name: Wait for WARP to initialize
        run: |
          echo "⏳ Waiting for WARP to initialize..."
          sleep 15

      - name: Check container is running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' warp-test)" != "true" ]; then
            echo "❌ Container is not running"
            docker logs warp-test
            exit 1
          fi
          echo "✅ Container is running"

      - name: Check container logs
        run: |
          echo "📋 Container logs:"
          docker logs warp-test

      - name: Test WARP connection status
        run: |
          echo "🔍 Checking WARP connection status..."
          
          STATUS=$(docker exec warp-test warp-cli --accept-tos status)
          echo "$STATUS"
          
          if echo "$STATUS" | grep -q "Connected"; then
            echo "✅ WARP is connected"
          else
            echo "❌ WARP is not connected"
            docker logs warp-test
            exit 1
          fi
          
          echo "📋 WARP settings:"
          docker exec warp-test warp-cli --accept-tos settings

      - name: Test SOCKS5 proxy is listening
        run: |
          echo "🔍 Checking if SOCKS5 proxy is listening on port 1080..."
          sleep 5
          
          if nc -z localhost 1080; then
            echo "✅ SOCKS5 proxy is listening on port 1080"
          else
            echo "❌ SOCKS5 proxy is not listening"
            docker logs warp-test
            exit 1
          fi

      - name: Test proxy connectivity
        run: |
          echo "🔍 Testing proxy connectivity..."
          
          if curl -x socks5h://localhost:1080 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace; then
            echo ""
            echo "✅ Proxy connectivity test passed"
          else
            echo "❌ Proxy connectivity test failed"
            docker logs warp-test
            exit 1
          fi

      - name: Test WARP trace (check if connected to WARP)
        run: |
          echo "🔍 Checking if traffic is going through WARP..."
          
          TRACE=$(curl -x socks5h://localhost:1080 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          
          if [ -z "$TRACE" ]; then
            echo "❌ Failed to get trace from Cloudflare"
            docker logs warp-test
            exit 1
          fi
          
          echo "Trace output:"
          echo "$TRACE"
          
          if echo "$TRACE" | grep -qE "warp=(plus|on)"; then
            echo "✅ Traffic is routed through WARP!"
          else
            echo "❌ WARP connection not established - warp flag is not 'on' or 'plus'"
            docker logs warp-test
            exit 1
          fi

      - name: Test IP is different through WARP
        run: |
          echo "🔍 Verifying IP address changes through WARP..."
          
          REAL_IP=$(curl -s --max-time 15 https://ifconfig.me || curl -s --max-time 15 https://api.ipify.org)
          echo "Real IP: $REAL_IP"
          
          if [ -z "$REAL_IP" ]; then
            echo "❌ Failed to get real IP"
            exit 1
          fi
          
          WARP_IP=$(curl -x socks5h://localhost:1080 -s --max-time 30 https://ifconfig.me || curl -x socks5h://localhost:1080 -s --max-time 30 https://api.ipify.org)
          echo "WARP IP: $WARP_IP"
          
          if [ -z "$WARP_IP" ]; then
            echo "❌ Failed to get WARP IP"
            docker logs warp-test
            exit 1
          fi
          
          if [ "$REAL_IP" != "$WARP_IP" ]; then
            echo "✅ IP addresses are different - WARP is masking your real IP!"
          else
            echo "❌ IP addresses are the same - WARP is not working properly"
            docker logs warp-test
            exit 1
          fi

      - name: Run healthcheck script
        run: |
          echo "🔍 Running internal healthcheck..."
          if docker exec warp-test /healthcheck/index.sh; then
            echo "✅ Healthcheck passed"
          else
            echo "❌ Healthcheck failed"
            docker logs warp-test
            exit 1
          fi

      - name: Test container restart
        run: |
          echo "🔄 Testing container restart..."
          docker restart warp-test
          sleep 15
          
          if [ "$(docker inspect -f '{{.State.Running}}' warp-test)" = "true" ]; then
            echo "✅ Container restarted successfully"
          else
            echo "❌ Container failed to restart"
            docker logs warp-test
            exit 1
          fi
          
          echo "⏳ Waiting for WARP to reconnect after restart..."
          for i in $(seq 1 30); do
            if docker exec warp-test warp-cli --accept-tos status 2>/dev/null | grep -q "Connected"; then
              echo "✅ WARP reconnected after restart (${i}s)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ WARP did not reconnect after 30s"
              docker logs warp-test
              exit 1
            fi
            sleep 1
          done

      - name: Test direct SOCKS5 proxy (port 1081)
        run: |
          echo "🔍 Testing direct SOCKS5 proxy on port 1081..."
          
          if ! nc -z localhost 1081; then
            echo "❌ Direct SOCKS5 proxy is not listening on port 1081"
            docker logs warp-test
            exit 1
          fi
          echo "✅ Direct SOCKS5 proxy is listening on port 1081"
          
          DIRECT_IP=$(curl -x socks5h://localhost:1081 -s --max-time 30 https://ifconfig.me || \
                      curl -x socks5h://localhost:1081 -s --max-time 30 https://api.ipify.org)
          echo "Direct proxy IP: $DIRECT_IP"
          
          if [ -n "$DIRECT_IP" ]; then
            echo "✅ Direct SOCKS5 proxy is working"
          else
            echo "❌ Direct SOCKS5 proxy connectivity failed"
            docker logs warp-test
            exit 1
          fi

      - name: Test HTTP WARP proxy (port 8080)
        run: |
          echo "🔍 Testing HTTP WARP proxy on port 8080..."
          
          if ! nc -z localhost 8080; then
            echo "❌ HTTP WARP proxy is not listening on port 8080"
            docker logs warp-test
            exit 1
          fi
          echo "✅ HTTP WARP proxy is listening on port 8080"
          
          TRACE=""
          for attempt in 1 2 3; do
            TRACE=$(curl -x http://localhost:8080 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace) && break
            echo "⚠️ Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "Trace output:"
          echo "$TRACE"
          
          if echo "$TRACE" | grep -qE "warp=(plus|on)"; then
            echo "✅ HTTP traffic is routed through WARP!"
          else
            echo "❌ HTTP WARP proxy not routing through WARP"
            docker logs warp-test
            exit 1
          fi

      - name: Test HTTP direct proxy (port 8081)
        run: |
          echo "🔍 Testing HTTP direct proxy on port 8081..."
          
          if ! nc -z localhost 8081; then
            echo "❌ HTTP direct proxy is not listening on port 8081"
            docker logs warp-test
            exit 1
          fi
          echo "✅ HTTP direct proxy is listening on port 8081"
          
          DIRECT_IP=$(curl -x http://localhost:8081 -s --max-time 30 https://ifconfig.me || \
                      curl -x http://localhost:8081 -s --max-time 30 https://api.ipify.org)
          echo "HTTP Direct proxy IP: $DIRECT_IP"
          
          if [ -n "$DIRECT_IP" ]; then
            echo "✅ HTTP direct proxy is working"
          else
            echo "❌ HTTP direct proxy connectivity failed"
            docker logs warp-test
            exit 1
          fi

      - name: Verify direct proxies use real IP (not WARP)
        run: |
          echo "🔍 Verifying direct proxies bypass WARP..."
          
          # Check SOCKS5 direct trace
          DIRECT_TRACE=$(curl -x socks5h://localhost:1081 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          echo "Direct SOCKS5 trace:"
          echo "$DIRECT_TRACE"
          
          if echo "$DIRECT_TRACE" | grep -qE "warp=off"; then
            echo "✅ SOCKS5 direct proxy correctly bypasses WARP (warp=off)"
          else
            echo "⚠️ SOCKS5 direct proxy warp status: $(echo "$DIRECT_TRACE" | grep "^warp=")"
          fi
          
          # Check HTTP direct trace
          HTTP_DIRECT_TRACE=$(curl -x http://localhost:8081 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          echo "Direct HTTP trace:"
          echo "$HTTP_DIRECT_TRACE"
          
          if echo "$HTTP_DIRECT_TRACE" | grep -qE "warp=off"; then
            echo "✅ HTTP direct proxy correctly bypasses WARP (warp=off)"
          else
            echo "⚠️ HTTP direct proxy warp status: $(echo "$HTTP_DIRECT_TRACE" | grep "^warp=")"
          fi

      - name: Cleanup test container (no auth)
        run: |
          echo "🧹 Cleaning up container without auth..."
          docker stop warp-test || true
          docker rm warp-test || true

      # ========================================
      # Test with Authentication
      # ========================================
      - name: Run container with authentication
        run: |
          echo "🔐 Starting container with authentication enabled..."
          docker run -d \
            --name warp-test-auth \
            -e PROXY_USER=${{ env.TEST_USER }} \
            -e PROXY_PASS=${{ env.TEST_PASS }} \
            -p 2080:1080 \
            -p 2081:1081 \
            -p 9080:8080 \
            -p 9081:8081 \
            ${{ env.TEST_TAG }}
          
          echo "✅ Container with auth started"

      - name: Wait for WARP to initialize (auth container)
        run: |
          echo "⏳ Waiting for WARP to initialize..."
          sleep 15

      - name: Test auth container is running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' warp-test-auth)" != "true" ]; then
            echo "❌ Auth container is not running"
            docker logs warp-test-auth
            exit 1
          fi
          echo "✅ Auth container is running"

      - name: Test authentication blocks unauthenticated requests
        run: |
          echo "🔍 Testing that unauthenticated requests are blocked..."
          
          # SOCKS5 without auth should fail
          if curl -x socks5h://localhost:2080 -s --max-time 10 https://cloudflare.com/cdn-cgi/trace 2>/dev/null; then
            echo "❌ SOCKS5 proxy allowed unauthenticated request (should be blocked)"
            exit 1
          else
            echo "✅ SOCKS5 proxy correctly blocked unauthenticated request"
          fi
          
          # HTTP without auth should fail
          if curl -x http://localhost:9080 -s --max-time 10 https://cloudflare.com/cdn-cgi/trace 2>/dev/null; then
            echo "❌ HTTP proxy allowed unauthenticated request (should be blocked)"
            exit 1
          else
            echo "✅ HTTP proxy correctly blocked unauthenticated request"
          fi

      - name: Test SOCKS5 WARP proxy with authentication
        run: |
          echo "🔍 Testing SOCKS5 WARP proxy with auth..."
          
          TRACE=$(curl -x socks5h://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:2080 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          
          if [ -z "$TRACE" ]; then
            echo "❌ Failed to connect with authentication"
            docker logs warp-test-auth
            exit 1
          fi
          
          echo "Trace output:"
          echo "$TRACE"
          
          if echo "$TRACE" | grep -qE "warp=(plus|on)"; then
            echo "✅ SOCKS5 with auth routes through WARP!"
          else
            echo "❌ SOCKS5 with auth not routing through WARP"
            docker logs warp-test-auth
            exit 1
          fi

      - name: Test HTTP WARP proxy with authentication
        run: |
          echo "🔍 Testing HTTP WARP proxy with auth..."
          
          TRACE=$(curl -x http://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:9080 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          
          if [ -z "$TRACE" ]; then
            echo "❌ Failed to connect with authentication"
            docker logs warp-test-auth
            exit 1
          fi
          
          echo "Trace output:"
          echo "$TRACE"
          
          if echo "$TRACE" | grep -qE "warp=(plus|on)"; then
            echo "✅ HTTP with auth routes through WARP!"
          else
            echo "❌ HTTP with auth not routing through WARP"
            docker logs warp-test-auth
            exit 1
          fi

      - name: Test direct proxies with authentication
        run: |
          echo "🔍 Testing direct proxies with auth..."
          
          # SOCKS5 direct with auth
          DIRECT_SOCKS=$(curl -x socks5h://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:2081 -s --max-time 30 https://ifconfig.me)
          if [ -n "$DIRECT_SOCKS" ]; then
            echo "✅ SOCKS5 direct with auth works - IP: $DIRECT_SOCKS"
          else
            echo "❌ SOCKS5 direct with auth failed"
            docker logs warp-test-auth
            exit 1
          fi
          
          # HTTP direct with auth
          DIRECT_HTTP=$(curl -x http://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:9081 -s --max-time 30 https://ifconfig.me)
          if [ -n "$DIRECT_HTTP" ]; then
            echo "✅ HTTP direct with auth works - IP: $DIRECT_HTTP"
          else
            echo "❌ HTTP direct with auth failed"
            docker logs warp-test-auth
            exit 1
          fi

      - name: Cleanup test container (with auth)
        if: always()
        run: |
          echo "🧹 Cleaning up all test containers..."
          docker stop warp-test warp-test-auth || true
          docker rm warp-test warp-test-auth || true
          echo "✅ Cleanup complete"

      # ========================================
      # Test Shadowsocks Server
      # ========================================
      - name: Run container with Shadowsocks enabled
        run: |
          echo "🔐 Starting container with Shadowsocks (default password)..."
          docker run -d \
            --name warp-test-ss \
            -p 8388:8388 \
            -p 8389:8389 \
            ${{ env.TEST_TAG }}
          
          echo "✅ Container with Shadowsocks started (using default password: cloudflare-warp)"

      - name: Wait for Shadowsocks to initialize
        run: |
          echo "⏳ Waiting for Shadowsocks server to initialize..."
          sleep 15

      - name: Check Shadowsocks container is running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' warp-test-ss)" != "true" ]; then
            echo "❌ Shadowsocks container is not running"
            docker logs warp-test-ss
            exit 1
          fi
          echo "✅ Shadowsocks container is running"
          echo "📋 Container logs:"
          docker logs warp-test-ss

      - name: Test Shadowsocks WARP port is listening
        run: |
          echo "🔍 Checking if Shadowsocks WARP server is listening on port 8388..."
          
          if nc -z localhost 8388; then
            echo "✅ Shadowsocks WARP server is listening on port 8388"
          else
            echo "❌ Shadowsocks WARP server is not listening"
            docker logs warp-test-ss
            exit 1
          fi

      - name: Test Shadowsocks Direct port is listening
        run: |
          echo "🔍 Checking if Shadowsocks Direct server is listening on port 8389..."
          
          if nc -z localhost 8389; then
            echo "✅ Shadowsocks Direct server is listening on port 8389"
          else
            echo "❌ Shadowsocks Direct server is not listening"
            docker logs warp-test-ss
            exit 1
          fi

      - name: Install Shadowsocks client for testing
        run: |
          echo "📦 Installing Shadowsocks client..."
          sudo apt-get update
          sudo apt-get install -y shadowsocks-libev
          echo "✅ Shadowsocks client installed"

      - name: Test Shadowsocks WARP proxy connectivity
        run: |
          echo "🔍 Testing Shadowsocks WARP proxy..."
          
          # Start ss-local to create a local SOCKS5 proxy from Shadowsocks
          ss-local -s 127.0.0.1 -p 8388 -l 10800 -k "${{ env.DEFAULT_SS_PASS }}" -m chacha20-ietf-poly1305 &
          SS_PID=$!
          sleep 3
          
          # Test connectivity through Shadowsocks
          TRACE=$(curl -x socks5h://localhost:10800 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          
          kill $SS_PID 2>/dev/null || true
          
          if [ -z "$TRACE" ]; then
            echo "❌ Failed to connect through Shadowsocks WARP proxy"
            docker logs warp-test-ss
            exit 1
          fi
          
          echo "Trace output:"
          echo "$TRACE"
          
          if echo "$TRACE" | grep -qE "warp=(plus|on)"; then
            echo "✅ Shadowsocks WARP proxy routes through WARP!"
          else
            echo "❌ Shadowsocks WARP proxy not routing through WARP"
            docker logs warp-test-ss
            exit 1
          fi

      - name: Test Shadowsocks Direct proxy connectivity
        run: |
          echo "🔍 Testing Shadowsocks Direct proxy..."
          
          # Start ss-local for direct port
          ss-local -s 127.0.0.1 -p 8389 -l 10801 -k "${{ env.DEFAULT_SS_PASS }}" -m chacha20-ietf-poly1305 &
          SS_PID=$!
          sleep 3
          
          # Test connectivity through Shadowsocks direct
          TRACE=$(curl -x socks5h://localhost:10801 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          
          kill $SS_PID 2>/dev/null || true
          
          if [ -z "$TRACE" ]; then
            echo "❌ Failed to connect through Shadowsocks Direct proxy"
            docker logs warp-test-ss
            exit 1
          fi
          
          echo "Trace output:"
          echo "$TRACE"
          
          if echo "$TRACE" | grep -qE "warp=off"; then
            echo "✅ Shadowsocks Direct proxy correctly bypasses WARP (warp=off)"
          else
            echo "⚠️ Shadowsocks Direct proxy warp status: $(echo "$TRACE" | grep "^warp=")"
            echo "✅ Shadowsocks Direct proxy is working"
          fi

      - name: Verify Shadowsocks IP masking through WARP
        run: |
          echo "🔍 Verifying IP masking through Shadowsocks WARP..."
          
          # Get real IP
          REAL_IP=$(curl -s --max-time 15 https://ifconfig.me || curl -s --max-time 15 https://api.ipify.org)
          echo "Real IP: $REAL_IP"
          
          # Start ss-local for WARP port
          ss-local -s 127.0.0.1 -p 8388 -l 10802 -k "${{ env.DEFAULT_SS_PASS }}" -m chacha20-ietf-poly1305 &
          SS_PID=$!
          sleep 3
          
          # Get IP through Shadowsocks WARP
          SS_WARP_IP=$(curl -x socks5h://localhost:10802 -s --max-time 30 https://ifconfig.me || \
                       curl -x socks5h://localhost:10802 -s --max-time 30 https://api.ipify.org)
          
          kill $SS_PID 2>/dev/null || true
          
          echo "Shadowsocks WARP IP: $SS_WARP_IP"
          
          if [ -n "$REAL_IP" ] && [ -n "$SS_WARP_IP" ]; then
            if [ "$REAL_IP" != "$SS_WARP_IP" ]; then
              echo "✅ Shadowsocks WARP proxy masks IP! (Real: $REAL_IP → WARP: $SS_WARP_IP)"
            else
              echo "❌ IP addresses are the same - Shadowsocks WARP not working properly"
              docker logs warp-test-ss
              exit 1
            fi
          else
            echo "❌ Failed to retrieve IP addresses"
            docker logs warp-test-ss
            exit 1
          fi

      - name: Cleanup Shadowsocks test container
        if: always()
        run: |
          echo "🧹 Cleaning up Shadowsocks test container..."
          docker stop warp-test-ss || true
          docker rm warp-test-ss || true
          echo "✅ Cleanup complete"

      # ========================================
      # Test All Modes Together (SOCKS5 + HTTP + Shadowsocks + Auth)
      # ========================================
      - name: Run container with ALL modes enabled
        run: |
          echo "🚀 Starting container with ALL modes enabled..."
          docker run -d \
            --name warp-test-all \
            -e PROXY_USER=${{ env.TEST_USER }} \
            -e PROXY_PASS=${{ env.TEST_PASS }} \
            -p 3080:1080 \
            -p 3081:1081 \
            -p 3880:8080 \
            -p 3881:8081 \
            -p 3388:8388 \
            -p 3389:8389 \
            ${{ env.TEST_TAG }}
          
          echo "✅ Container with all modes started (SS uses PROXY_PASS)"

      - name: Wait for all services to initialize
        run: |
          echo "⏳ Waiting for all services to initialize..."
          sleep 15

      - name: Check all-modes container is running
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' warp-test-all)" != "true" ]; then
            echo "❌ All-modes container is not running"
            docker logs warp-test-all
            exit 1
          fi
          echo "✅ All-modes container is running"
          echo "📋 Container logs:"
          docker logs warp-test-all

      - name: Verify all 6 ports are listening
        run: |
          echo "🔍 Checking all 6 ports are listening..."
          
          FAILED=0
          
          for port in 3080 3081 3880 3881 3388 3389; do
            if nc -z localhost $port; then
              echo "✅ Port $port is listening"
            else
              echo "❌ Port $port is NOT listening"
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            docker logs warp-test-all
            exit 1
          fi
          
          echo "✅ All 6 ports are listening!"

      - name: Test all WARP proxies route through WARP
        run: |
          echo "🔍 Testing all WARP proxies..."
          
          # SOCKS5 WARP
          echo "Testing SOCKS5 WARP (port 3080)..."
          TRACE1=$(curl -x socks5h://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3080 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          if echo "$TRACE1" | grep -qE "warp=(plus|on)"; then
            echo "✅ SOCKS5 WARP: OK"
          else
            echo "❌ SOCKS5 WARP: FAILED"
            exit 1
          fi
          
          # HTTP WARP
          echo "Testing HTTP WARP (port 3880)..."
          TRACE2=$(curl -x http://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3880 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          if echo "$TRACE2" | grep -qE "warp=(plus|on)"; then
            echo "✅ HTTP WARP: OK"
          else
            echo "❌ HTTP WARP: FAILED"
            exit 1
          fi
          
          # Shadowsocks WARP
          echo "Testing Shadowsocks WARP (port 3388)..."
          ss-local -s 127.0.0.1 -p 3388 -l 13388 -k "${{ env.TEST_PASS }}" -m chacha20-ietf-poly1305 &
          SS_PID=$!
          sleep 3
          TRACE3=$(curl -x socks5h://localhost:13388 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          kill $SS_PID 2>/dev/null || true
          if echo "$TRACE3" | grep -qE "warp=(plus|on)"; then
            echo "✅ Shadowsocks WARP: OK"
          else
            echo "❌ Shadowsocks WARP: FAILED"
            exit 1
          fi
          
          echo "✅ All WARP proxies working!"

      - name: Test all Direct proxies bypass WARP
        run: |
          echo "🔍 Testing all Direct proxies..."
          
          # SOCKS5 Direct
          echo "Testing SOCKS5 Direct (port 3081)..."
          TRACE1=$(curl -x socks5h://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3081 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          if [ -n "$TRACE1" ]; then
            echo "✅ SOCKS5 Direct: OK (warp=$(echo "$TRACE1" | grep "^warp=" | cut -d= -f2))"
          else
            echo "❌ SOCKS5 Direct: FAILED"
            exit 1
          fi
          
          # HTTP Direct
          echo "Testing HTTP Direct (port 3881)..."
          TRACE2=$(curl -x http://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3881 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          if [ -n "$TRACE2" ]; then
            echo "✅ HTTP Direct: OK (warp=$(echo "$TRACE2" | grep "^warp=" | cut -d= -f2))"
          else
            echo "❌ HTTP Direct: FAILED"
            exit 1
          fi
          
          # Shadowsocks Direct
          echo "Testing Shadowsocks Direct (port 3389)..."
          ss-local -s 127.0.0.1 -p 3389 -l 13389 -k "${{ env.TEST_PASS }}" -m chacha20-ietf-poly1305 &
          SS_PID=$!
          sleep 3
          TRACE3=$(curl -x socks5h://localhost:13389 -s --max-time 30 https://cloudflare.com/cdn-cgi/trace)
          kill $SS_PID 2>/dev/null || true
          if [ -n "$TRACE3" ]; then
            echo "✅ Shadowsocks Direct: OK (warp=$(echo "$TRACE3" | grep "^warp=" | cut -d= -f2))"
          else
            echo "❌ Shadowsocks Direct: FAILED"
            exit 1
          fi
          
          echo "✅ All Direct proxies working!"

      - name: Test concurrent connections on all protocols
        run: |
          echo "🔍 Testing concurrent connections across all protocols..."
          
          # Start Shadowsocks local clients
          ss-local -s 127.0.0.1 -p 3388 -l 14388 -k "${{ env.TEST_PASS }}" -m chacha20-ietf-poly1305 &
          SS1_PID=$!
          ss-local -s 127.0.0.1 -p 3389 -l 14389 -k "${{ env.TEST_PASS }}" -m chacha20-ietf-poly1305 &
          SS2_PID=$!
          sleep 3
          
          # Run all 6 requests concurrently using Cloudflare trace (more reliable than ifconfig.me)
          curl -x socks5h://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3080 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace > /tmp/r1 &
          PID1=$!
          curl -x socks5h://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3081 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace > /tmp/r2 &
          PID2=$!
          curl -x http://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3880 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace > /tmp/r3 &
          PID3=$!
          curl -x http://${{ env.TEST_USER }}:${{ env.TEST_PASS }}@localhost:3881 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace > /tmp/r4 &
          PID4=$!
          curl -x socks5h://localhost:14388 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace > /tmp/r5 &
          PID5=$!
          curl -x socks5h://localhost:14389 -s --max-time 15 https://cloudflare.com/cdn-cgi/trace > /tmp/r6 &
          PID6=$!
          
          # Wait for each with timeout
          wait $PID1 || echo "Request 1 timed out"
          wait $PID2 || echo "Request 2 timed out"
          wait $PID3 || echo "Request 3 timed out"
          wait $PID4 || echo "Request 4 timed out"
          wait $PID5 || echo "Request 5 timed out"
          wait $PID6 || echo "Request 6 timed out"
          
          kill $SS1_PID $SS2_PID 2>/dev/null || true
          
          echo "Results:"
          echo "  SOCKS5 WARP:       $(grep -c 'warp=' /tmp/r1 2>/dev/null || echo 'failed') lines"
          echo "  SOCKS5 Direct:     $(grep -c 'warp=' /tmp/r2 2>/dev/null || echo 'failed') lines"
          echo "  HTTP WARP:         $(grep -c 'warp=' /tmp/r3 2>/dev/null || echo 'failed') lines"
          echo "  HTTP Direct:       $(grep -c 'warp=' /tmp/r4 2>/dev/null || echo 'failed') lines"
          echo "  Shadowsocks WARP:  $(grep -c 'warp=' /tmp/r5 2>/dev/null || echo 'failed') lines"
          echo "  Shadowsocks Direct:$(grep -c 'warp=' /tmp/r6 2>/dev/null || echo 'failed') lines"
          
          # Verify all got responses (check for 'warp=' in trace output)
          FAILED=0
          for i in 1 2 3 4 5 6; do
            if ! grep -q 'warp=' /tmp/r$i 2>/dev/null; then
              echo "❌ Request $i failed or empty"
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo "Some requests failed, but continuing..."
            docker logs warp-test-all | tail -30
          fi
          
          echo "✅ Concurrent connections test completed!"

      - name: Cleanup all-modes test container
        if: always()
        run: |
          echo "🧹 Cleaning up all-modes test container..."
          docker stop warp-test-all || true
          docker rm warp-test-all || true
          echo "✅ Cleanup complete"

  push:
    needs: build-and-test
    permissions:
      contents: write
      packages: write
      actions: write
    uses: dubloksoftware/workflows/.github/workflows/build-and-push.yml@main
    with:
      image_name: cloudflare-warp
      platforms: 'linux/amd64,linux/arm64'
      context_path: '.'
      dockerfile_path: 'Dockerfile'
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
